[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fmt]
line_length = 100
tab_width = 2
bracket_spacing = false

[fuzz]
runs = 512

[rpc_endpoints]
bot_mainnet = "${BOT_MAINNET_RPC_URL}"
bohr = "${BOHR_RPC_URL}"
